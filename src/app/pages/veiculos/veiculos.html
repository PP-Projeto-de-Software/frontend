<div class="container mt-5">

  <h1 class="mb-4">
    🚗 Veículos
  </h1>


  <!-- FORMULÁRIO -->
  <div class="card shadow mb-5">

    <div class="card-body">

      <h4 class="mb-4">
        Cadastrar Veículo
      </h4>


      <div class="mb-3">

        <label class="form-label">
          Modelo
        </label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="novoVeiculo.modelo"
        >

      </div>


      <div class="mb-3">

        <label class="form-label">
          Marca
        </label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="novoVeiculo.marca"
        >

      </div>


      <div class="mb-3">

        <label class="form-label">
          Placa
        </label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="novoVeiculo.placa"
        >

      </div>


      <div class="mb-3">

        <label class="form-label">
          Ano
        </label>

        <input
          type="number"
          class="form-control"
          [(ngModel)]="novoVeiculo.ano"
        >

      </div>


      <div class="mb-3">

        <label class="form-label">
          Cliente ID
        </label>

        <input
          type="number"
          class="form-control"
          [(ngModel)]="novoVeiculo.cliente_id"
        >

      </div>


      <button
        class="btn btn-dark"
        (click)="cadastrarVeiculo()"
      >
        Cadastrar
      </button>

    </div>

  </div>


  <!-- TABELA -->
  <div class="card shadow">

    <div class="card-body">

      <h4 class="mb-4">
        Lista de Veículos
      </h4>

      <table class="table table-bordered table-striped">

        <thead class="table-dark">

          <tr>
            <th>ID</th>
            <th>Modelo</th>
            <th>Marca</th>
            <th>Placa</th>
            <th>Ano</th>
            <th>Cliente ID</th>
          </tr>

        </thead>

        <tbody>

          @for(veiculo of veiculos; track veiculo.id){

            <tr>

              <td>{{ veiculo.id }}</td>
              <td>{{ veiculo.modelo }}</td>
              <td>{{ veiculo.marca }}</td>
              <td>{{ veiculo.placa }}</td>
              <td>{{ veiculo.ano }}</td>
              <td>{{ veiculo.cliente_id }}</td>

            </tr>

          }

        </tbody>

      </table>

    </div>

  </div>

</div>
