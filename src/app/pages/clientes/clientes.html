<div class="container mt-5">

  <h1 class="mb-4">
    Clientes
  </h1>

  <table class="table table-bordered">

    <thead>

      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Telefone</th>
        <th>Email</th>
      </tr>

    </thead>

    <tbody>

      @for(cliente of clientes; track cliente.id){

        <tr>

          <td>{{ cliente.id }}</td>
          <td>{{ cliente.nome }}</td>
          <td>{{ cliente.telefone }}</td>
          <td>{{ cliente.email }}</td>

        </tr>

      }

    </tbody>

  </table>

</div>
